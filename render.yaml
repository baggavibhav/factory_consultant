# Render Blueprint: free demo. Sleeps after 15 minutes idle; anything visitors create
# is lost when it sleeps or redeploys. The three sample projects are recreated on each start.
services:
  - type: web
    name: factory-consultant-demo
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FCA_DEMO
        value: "1"
      - key: FCA_DATA_DIR
        value: /tmp/projects
