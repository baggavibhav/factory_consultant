[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factory-consultant-agent"
version = "0.1.0"
description = "Switz Group Factory Consultant Agent: plant drawings to 3D model, BOQ, cost estimate and bid evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf>=1.4.4,<1.5",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
fca = "fca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fca"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["reference: needs the reference plant drawing in data/reference (skipped if absent)"]
