# Concept-design template: industrial bakery plant.
# Shares are relative weights of the production hall area (they are normalised).
# Source: proportions of reference plant #1 plus general bakery-plant practice.
# Engineering: adjust these to match Switz standards; every change is versioned in git.
name = "Industrial bakery plant"

[building]
target_depth_m = 40.0        # preferred clear span (building depth)
min_depth_m = 24.0
max_depth_m = 45.0           # beyond this a single clear span is uneconomic
bay_m = 9.0                  # target frame spacing
roof_pitch_deg = 5.0

[site]
setback_front_m = 10.0      # street side: parking and pedestrian access
setback_rear_m = 6.0
setback_west_m = 20.0       # goods-in yard: raw-material trucks and docks
setback_east_m = 35.0       # dispatch apron: trucks turning and docking
min_goods_in_yard_m = 15.0    # checks warn below these (truck sizes for this plant type)
min_dispatch_apron_m = 30.0

[strip]
corridor_m = 2.0           # corridor between the two rows of rooms
row_min_m = 5.0
row_max_m = 8.0

# Rooms along the street side. row: "south" (street) or "north" (next to the hall).
# Area = base_m2 + per_person x people, where people is the staff group:
# male / female production staff, office staff, or all production staff.
# per_area_m2 adds a share of the built-up area (plant rooms).

[[strip_room]]
name = "Reception and lobby"
category = "office"
row = "south"
base_m2 = 40

[[strip_room]]
name = "Offices"
category = "office"
row = "south"
base_m2 = 20
per_person = 10
people = "office"

[[strip_room]]
name = "Production office"
category = "office"
row = "south"
base_m2 = 20

[[strip_room]]
name = "QA laboratory"
category = "office"
row = "south"
base_m2 = 30
requires = "qa_lab"

[[strip_room]]
name = "Sample test"
category = "office"
row = "south"
base_m2 = 15
requires = "qa_lab"

[[strip_room]]
name = "First aid"
category = "amenity"
row = "south"
base_m2 = 12

[[strip_room]]
name = "Server and telephone room"
category = "utility"
row = "south"
base_m2 = 12

[[strip_room]]
name = "Maintenance and store"
category = "utility"
row = "south"
base_m2 = 40

[[strip_room]]
name = "LT panel room"
category = "utility"
row = "south"
base_m2 = 20
per_area_m2 = 0.002

[[strip_room]]
name = "CO2 and services"
category = "utility"
row = "south"
base_m2 = 20

[[strip_room]]
name = "Male prayer and ablution"
category = "amenity"
row = "north"
base_m2 = 15
per_person = 0.35
people = "male"

[[strip_room]]
name = "Male changing, toilets and showers"
category = "amenity"
row = "north"
base_m2 = 15
per_person = 1.0
people = "male"

[[strip_room]]
name = "Male hygiene station"
category = "amenity"
row = "north"
base_m2 = 8
per_person = 0.2
people = "male"

[[strip_room]]
name = "Female hygiene station"
category = "amenity"
row = "north"
base_m2 = 8
per_person = 0.2
people = "female"

[[strip_room]]
name = "Female changing, toilets and showers"
category = "amenity"
row = "north"
base_m2 = 15
per_person = 1.0
people = "female"

[[strip_room]]
name = "Female prayer and ablution"
category = "amenity"
row = "north"
base_m2 = 10
per_person = 0.35
people = "female"

[[strip_room]]
name = "Dining"
category = "amenity"
row = "north"
base_m2 = 20
per_person = 0.5
people = "all"

[[strip_room]]
name = "Compressor room"
category = "utility"
row = "north"
base_m2 = 25

[production]
min_m2_per_line = 400.0      # warn if production area is below this per line

# Hall zones in process-flow order (west to east). Zones in the same group are
# stacked north-south in one slice. temp_c is shown on labels.
[[hall]]
group = 1
name = "RM store"
share = 10
category = "storage"
temp_c = 23

[[hall]]
group = 2
name = "Production area"
share = 45
category = "production"
temp_c = 23

[[hall]]
group = 3
name = "Cooling area"
share = 10
category = "production"

[[hall]]
group = 4
name = "Packaging area"
share = 13
category = "production"
temp_c = 23

[[hall]]
group = 4
name = "PM store"
share = 6
category = "storage"
temp_c = 23

[[hall]]
group = 5
name = "Cold store"
share = 9
category = "cold"
temp_c = -18
requires = "cold_storage"

[[hall]]
group = 5
name = "Blast freezer"
share = 3
category = "cold"
temp_c = -40
requires = "blast_freezer"

[[hall]]
group = 6
name = "Marshalling and dispatch"
share = 7
category = "dispatch"
