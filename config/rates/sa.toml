# Rate library: Saudi Arabia (SAR). Installed rates unless stated.
#
# confidence:
#   official  - from GASTAT official material prices (supply), converted to installed
#   published - from a published supplier/market price (supply), converted to installed
#   allowance - estimator allowance, NOT from a cited source; replace with quotes
#
# Conversion from supply price to installed rate uses the stated factor (labour, plant,
# waste, small materials, fixing). Factors are estimator assumptions.
# low/high give the range used for the estimate's low and high totals.
# match: any of these texts found in the BOQ item description or material (case-insensitive).
# per: "kva" or "m3" makes the rate base + per_value x the number in the description.

name = "Saudi Arabia rate library"
currency = "SAR"
rate_date = "2026-07-01"          # average date of the sourced prices
escalation_per_year = 0.02         # GASTAT Construction Cost Index rose 2% year on year (March 2026)

[defaults]
preliminaries = 0.10               # Turner & Townsend ICMS 2025: average 10.0–11.1%
overhead_profit = 0.10             # Turner & Townsend ICMS 2025: about 10.6% on smaller projects
contingency = 0.10                 # concept-stage allowance
vat = 0.15                         # Saudi VAT
construction_months = 14

[[benchmark]]
name = "Food production / dairy facility (Compass International)"
low_per_m2 = 3510                  # USD 936/m² at 3.75 SAR/USD
high_per_m2 = 6011                 # USD 1,603/m²
note = "Older published range; excludes refrigeration equipment and process piping"
url = "https://www.compassinternational.net"

